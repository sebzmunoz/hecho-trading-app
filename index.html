<div class="app-shell" id="appShell">
  <!-- CONTROL PANEL -->
  <aside class="console" id="console" aria-label="Prototype control panel">
    <div class="console-head">
      <div class="brand-row">
        <svg class="hecho-logo" viewBox="0 0 463 168" aria-hidden="true"><use href="#hecho-mark"/></svg>
        <span class="ver">Prototype</span>
      </div>
      <p class="sub">51 screens · 7 flows · every state. Drive the app live from here.</p>
    </div>
    <div class="console-tabs" role="tablist" id="consoleTabs">
      <button role="tab" data-ctab="flows" aria-selected="true">Flows</button>
      <button role="tab" data-ctab="screens" aria-selected="false">Screens</button>
      <button role="tab" data-ctab="vars" aria-selected="false">Variables</button>
      <button role="tab" data-ctab="tel" aria-selected="false">Telemetry</button>
    </div>
    <div class="console-body" id="consoleBody"></div>
    <div class="console-foot">
      <span id="footScreen">—</span>
      <span>Design System v3.0</span>
    </div>
  </aside>

  <!-- STAGE + DEVICE -->
  <div class="stage">
    <div class="device-wrap">
      <div class="device-tools" id="deviceTools">
        <button id="toolConsole" aria-label="Toggle control panel" title="Toggle control panel">
          <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="6" width="22" height="20" rx="2"/><path d="M13 6v20"/></svg>
        </button>
        <button id="toolTheme" aria-label="Toggle dark theme" aria-pressed="false" title="Toggle theme">
          <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M24 18a9 9 0 0 1-11-11 9 9 0 1 0 11 11z"/></svg>
        </button>
        <button id="toolBack" aria-label="Back" title="Back">
          <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L10 16l10 10"/></svg>
        </button>
      </div>
      <div class="device" id="device">
        <div class="notch" aria-hidden="true"></div>
        <div class="screen-frame" id="screenFrame">
          <div class="statusbar" id="statusbar">
            <span class="clock">9:41</span>
            <span class="ind">
              <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="1" y="14" width="3" height="6" rx="1"/><rect x="6" y="10" width="3" height="10" rx="1"/><rect x="11" y="6" width="3" height="14" rx="1"/><rect x="16" y="2" width="3" height="18" rx="1" opacity=".4"/></svg>

              <span class="batt" aria-label="Battery"></span>
            </span>
          </div>
          <header class="app-header" id="appHeader"></header>
          <div class="net-slot" id="netSlot"></div>
          <main class="screen-scroll" id="screen-scroll" tabindex="-1">
            <div class="screen-body" id="screenBody"></div>
          </main>
          <div class="home-indicator"><i></i></div>
          <div class="device-overlay" id="overlayRoot" aria-live="polite"></div>
          <div class="toast-host" id="toastHost" aria-live="polite"></div>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="console-scrim" id="consoleScrim" aria-hidden="true"></div>
<button class="proto-fab left" id="fabConsole" hidden>

</button>
